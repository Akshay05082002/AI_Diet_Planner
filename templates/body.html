<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Diet Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #102a43;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 32px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .header h1 {
      margin: 0;
      font-size: 1.9rem;
    }
    .dark-btn,
    .generate-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .container {
      max-width: 900px;
      margin: 32px auto 16px;
      padding: 0 20px;
    }
    .diet-form {
      background: #ffffff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }
    .diet-form h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.6rem;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
    }
    .generate-btn {
      width: 100%;
      margin-top: 8px;
    }
    .result-section {
      max-width: 900px;
      margin: 24px auto 40px;
      padding: 24px;
      border-radius: 18px;
      background: #ffffff;
      display: none;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }
    .result-section h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }
    .diet-card {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .diet-card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.15rem;
    }
    .dark-mode {
      background: #0f172a;
      color: #e2e8f0;
    }
    .dark-mode .header {
      background: #111827;
      border-color: #1f2937;
    }
    .dark-mode .diet-form,
    .dark-mode .result-section {
      background: #111827;
      color: #e2e8f0;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }
    .dark-mode .form-group input,
    .dark-mode .form-group select {
      background: #1f2937;
      border-color: #374151;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

<header class="header">
  <h1>🥗 Smart Diet Planner</h1>
  <button onclick="toggleDarkMode()" class="dark-btn">🌙 Dark Mode</button>
</header>

<div class="container">
  <h2>Create Your Diet Plan</h2>

  <form class="diet-form" onsubmit="event.preventDefault(); showLoading(this.querySelector('button'));">
    <div class="form-group">
      <label>Age</label>
      <input type="number" placeholder="Enter your age" required>
    </div>

    <div class="form-group">
      <label>Weight (kg)</label>
      <input type="number" placeholder="Enter your weight" required>
    </div>

    <div class="form-group">
      <label>Height (cm)</label>
      <input type="number" placeholder="Enter your height" required>
    </div>

    <div class="form-group">
      <label>Goal</label>
      <select>
        <option>Weight Loss</option>
        <option>Muscle Gain</option>
        <option>Maintain Weight</option>
      </select>
    </div>

    <div class="form-group">
      <label>Activity Level</label>
      <select>
        <option>Sedentary</option>
        <option>Moderate</option>
        <option>Active</option>
      </select>
    </div>

    <button type="submit" class="generate-btn">Generate Plan</button>
  </form>
</div>

<div class="result-section" id="diet-result">
  <h2>Your Sample Diet Plan</h2>

  <div class="diet-card">
    <h3>🍳 Breakfast</h3>
    <p>Oats with fruits + Boiled eggs + Green tea</p>
  </div>

  <div class="diet-card">
    <h3>🍛 Lunch</h3>
    <p>Brown rice + Grilled chicken / Paneer + Salad</p>
  </div>

  <div class="diet-card">
    <h3>🍎 Snacks</h3>
    <p>Apple + Almonds</p>
  </div>

  <div class="diet-card">
    <h3>🍲 Dinner</h3>
    <p>Vegetable soup + Whole wheat roti</p>
  </div>
</div>

<script>
  function showLoading(button) {
    if (!button) return;
    button.disabled = true;
    const originalText = button.textContent;
    button.textContent = 'Generating plan...';

    setTimeout(() => {
      button.disabled = false;
      button.textContent = originalText;
      const result = document.getElementById('diet-result');
      if (result) {
        result.style.display = 'block';
        result.scrollIntoView({ behavior: 'smooth' });
      }
    }, 800);
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const btn = document.querySelector('.dark-btn');
    if (!btn) return;
    btn.textContent = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
  }
</script>
</body>
</html>
